services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: sagar-global-portfolio:v7.1
    container_name: sagar-global-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
