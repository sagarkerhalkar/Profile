<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Profile/CV Editor</title><link rel="stylesheet" href="assets/site.css"></head><body class="simple"><main class="editor"><h1>Separate Profile / CV Editor</h1><p>This editor belongs only to the public profile website. It has no connection with the System Health Monitor project. Edit profile/CV JSON, download <code>profile_config.json</code>, replace <code>assets/profile_config.json</code>, then redeploy this profile folder only.</p><textarea id="jsonBox"></textarea><div class="actions"><button class="btn primary" id="downloadJson">Download profile_config.json</button><a class="btn" href="./">Preview Home</a><a class="btn" href="cv/">Preview CV</a></div></main><script>fetch('assets/profile_config.json').then(r=>r.text()).then(t=>jsonBox.value=t);downloadJson.onclick=()=>{try{JSON.parse(jsonBox.value)}catch(e){alert('JSON error: '+e.message);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([jsonBox.value],{type:'application/json'}));a.download='profile_config.json';a.click()}</script></body></html>
